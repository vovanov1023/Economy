name: Economy
version: ${pluginVersion}
main: me.vovanov.economy.Economy
api-version: ${minecraftVersion}
author: vovanov
description: The economy plugin
depend: [Vault]
softdepend: ["DiscordSRV"]
permissions:
  economy.reload:
    default: op
  economy.deposit:
    default: true
  economy.withdraw:
    default: true
  economy.balance:
    default: true
  economy.balance.others:
    default: op
  economy.atm:
    default: op
  economy.atm.remove:
    default: op
  economy.atm.create:
    default: op
  economy.atm.list:
    default: op
commands:
  economyreload:
    permission: economy.reload
    aliases: [ecoreload, ereload, erd]
  deposit:
    permission: economy.deposit
    aliases: [dep]
  withdraw:
    permission: economy.withdraw
    aliases: [wd]
  balance:
    permission: economy.balance
    aliases: [bal]
  atm:
    permission: economy.atm